base_map_dir: "Maps/CHANGLIAN-2"
align_map_dir: "Maps/szorb-fix"
final_map_dir: "Maps/CHANGLIAN-3"
thre_z_min: -0.2
thre_z_max: 2.0
ndt_transformation_epsilon: 0.00001
ndt_maximum_iterations: 100
# NDT 体素网格边长（米），过大易陷入错误局部最优，过小不稳定；可按场景在 0.5~3 间试
ndt_resolution: 1.0
# 坐标系都是ROS坐标系，程序内部会转换为LeGO坐标系
# 对应关系：ROS (x,y,z) <-> LeGO (y,z,x)
# 从cuihua1地图上截取那段凹字形路段补到cuihua123地图上
align_to_base_t: [-11.5, 30.28, 0.0]
align_to_base_rpy_deg: [0.0, 0.0, 80.43]
base_match_roi_enable: false  # region of interest for base map matching
base_match_use_ros_coord: true # whether the base match roi is defined in ROS coordinate system (x,y,z) or LeGO coordinate system (y,z,x)
base_match_roi: [-185.0, -433.0, -0.2, -95.0, -299.0, 80.0]